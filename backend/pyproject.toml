[project]
name = "supplygraph"
version = "0.1.0"
description = "Sector → supplier dependency graphs, built from filings with AI-assisted categorisation."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlmodel>=0.0.16",
  "alembic>=1.13",
  "pyyaml>=6",
  "typer>=0.12",
  "pymupdf>=1.24",
  "anthropic>=0.40",
  "openai>=1.40",  # OpenAI-compatible endpoints: OpenAI, OpenRouter, Gemini, Groq, Ollama, LM Studio (D-26)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
quotes = ["yfinance>=0.2.50"]  # disg quotes (D-34)
exchanges = ["nse>=5.1"]  # disg fetch: filings from NSE (C5)

[project.scripts]
disg = "supplygraph.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["supplygraph*"]

[tool.setuptools.package-data]
supplygraph = ["migrations/script.py.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
