# Alembic config for the `alembic` CLI (run from backend/):
#   alembic revision --autogenerate -m "add fx table"
#   alembic upgrade head
# The database URL comes from supplygraph.db.get_engine (SG_DB_URL or data/supplygraph.db),
# and every `sg` command runs `upgrade head` on startup, so the CLI is only needed
# to author new revisions.
[alembic]
script_location = supplygraph/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
