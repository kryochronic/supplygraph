# Seed taxonomy: AI Infrastructure (India)
#
# Graph semantics
#   node.requires: [ids]  → edge  consumer ──requires──▶ supplier
#   The theme sits on the RIGHT of the graph; each hop left is one step
#   further upstream ("shifting left") toward components and raw materials.
#   Nodes may share suppliers (copper feeds cables, transformers, switchgear),
#   so this is a DAG, not a tree.
#
# Node kinds: theme | system | component | material | service
# Exposure:   core (segment is a primary revenue driver)
#             meaningful (material but not dominant)
#             peripheral (some exposure; story mostly elsewhere)
#
# All company mappings are v0 hand-curated from general knowledge, NOT from
# filings. status: proposed until verified against an AR / RHP / investor deck.

theme:
  id: ai_infra_in
  name: AI Infrastructure — India
  description: >
    Physical and service stack needed to stand up AI compute capacity in India,
    from grid to GPU.

nodes:
  # ── Theme and first-hop systems ────────────────────────────────────────────
  - id: ai_infra_in
    name: AI Infrastructure (India)
    kind: theme
    requires: [ai_compute, dc_capacity, connectivity]

  - id: ai_compute
    name: AI compute / GPU cloud
    kind: service
    layer: L6
    description: GPU-as-a-service, sovereign AI clouds, inference and training capacity.
    requires: [it_hardware, dc_capacity]

  - id: dc_capacity
    name: Data-centre capacity
    kind: system
    layer: L6
    description: Built, powered, cooled white space operated as colo or hyperscale.
    india_position: ~1.8 GW operational mid-2026; 3–8 GW pipeline
    requires: [power_supply, land_shell, electrical, cooling]

  - id: connectivity
    name: Connectivity
    kind: system
    layer: L5
    requires: [optical_fibre, carriers]

  # ── L0 Power supply (outside the fence) ───────────────────────────────────
  - id: power_supply
    name: Power supply
    kind: system
    layer: L0
    description: Round-the-clock, increasingly green power delivered to site.
    india_position: Generation adequate; transmission is the bottleneck
    requires: [generation, transmission]

  - id: generation
    name: Generation (RE + firm)
    kind: component
    layer: L0
    requires: [solar_modules]

  - id: solar_modules
    name: Solar modules & cells
    kind: component
    layer: L0

  - id: transmission
    name: Transmission & substations
    kind: system
    layer: L0
    requires: [power_transformers, conductors, towers, transmission_epc]

  - id: power_transformers
    name: Power transformers (HV/EHV)
    kind: component
    layer: L0
    requires: [crgo_steel, copper, transformer_oil]

  - id: conductors
    name: Conductors
    kind: component
    layer: L0
    requires: [aluminium]

  - id: towers
    name: Towers & structures
    kind: component
    layer: L0
    requires: [steel_cement]

  - id: transmission_epc
    name: Transmission EPC
    kind: service
    layer: L0

  # ── L1 Land, shell & civil ────────────────────────────────────────────────
  - id: land_shell
    name: Land, shell & civil
    kind: system
    layer: L1
    capex_share: ~5–10%
    requires: [dc_parks, civil_epc, steel_cement]

  - id: dc_parks
    name: DC parks & land banks
    kind: component
    layer: L1

  - id: civil_epc
    name: Civil & MEP EPC
    kind: service
    layer: L1

  # ── L2 Electrical (inside the fence) ──────────────────────────────────────
  - id: electrical
    name: Electrical (inside fence)
    kind: system
    layer: L2
    capex_share: ~10–15%
    requires: [switchgear, dist_transformers, cables, dg_sets, batteries, ups]

  - id: switchgear
    name: MV/LV switchgear & panels
    kind: component
    layer: L2
    requires: [copper]

  - id: dist_transformers
    name: Distribution transformers
    kind: component
    layer: L2
    requires: [crgo_steel, copper, transformer_oil]

  - id: cables
    name: Power & control cables
    kind: component
    layer: L2
    requires: [copper, aluminium]

  - id: dg_sets
    name: DG sets / backup power
    kind: component
    layer: L2

  - id: batteries
    name: Li-ion storage (UPS / BESS)
    kind: component
    layer: L2

  - id: ups
    name: UPS / power electronics
    kind: component
    layer: L2
    gap: true
    notes: Dominated by unlisted / foreign players (Vertiv, Schneider APC, Delta).

  # ── L3 Mechanical & cooling ───────────────────────────────────────────────
  - id: cooling
    name: Mechanical & cooling
    kind: system
    layer: L3
    capex_share: ~5–10%
    requires: [chillers, pumps_valves, pipes_hoses, liquid_cooling, water_treatment]

  - id: chillers
    name: Chillers & precision cooling
    kind: component
    layer: L3
    requires: [refrigerants]

  - id: pumps_valves
    name: Pumps & valves
    kind: component
    layer: L3

  - id: pipes_hoses
    name: Pipes, tubes & hoses
    kind: component
    layer: L3

  - id: liquid_cooling
    name: Liquid cooling (CDU, cold plate, immersion)
    kind: component
    layer: L3
    gap: true
    notes: No clear listed Indian player yet.
    requires: [pumps_valves, pipes_hoses, refrigerants]

  - id: water_treatment
    name: Water treatment
    kind: service
    layer: L3

  # ── L4 IT hardware ────────────────────────────────────────────────────────
  - id: it_hardware
    name: IT hardware
    kind: system
    layer: L4
    capex_share: ~60–75%
    india_position: Almost entirely imported
    requires: [gpus, servers, networking]

  - id: gpus
    name: GPUs, HBM & accelerators
    kind: component
    layer: L4
    gap: true
    notes: No listed Indian exposure (NVIDIA, AMD, SK hynix, Micron).

  - id: servers
    name: AI servers / HPC systems
    kind: component
    layer: L4
    requires: [ems_pcb, gpus]

  - id: ems_pcb
    name: EMS / PCB assembly
    kind: component
    layer: L4
    requires: [semis_osat]

  - id: semis_osat
    name: Semiconductors / OSAT
    kind: component
    layer: L4

  - id: networking
    name: Networking gear
    kind: component
    layer: L4
    requires: [optical_fibre]

  # ── L5 Connectivity ───────────────────────────────────────────────────────
  - id: optical_fibre
    name: Optical fibre & cable
    kind: component
    layer: L5

  - id: carriers
    name: Carriers & cable landing
    kind: service
    layer: L5

  # ── L7 Raw materials (far left) ───────────────────────────────────────────
  - id: copper
    name: Copper
    kind: material
    layer: L7

  - id: aluminium
    name: Aluminium
    kind: material
    layer: L7

  - id: crgo_steel
    name: CRGO electrical steel
    kind: material
    layer: L7
    india_position: Mostly imported; BIS QCO in force

  - id: transformer_oil
    name: Transformer oil
    kind: material
    layer: L7

  - id: steel_cement
    name: Steel & cement
    kind: material
    layer: L7

  - id: refrigerants
    name: Refrigerants & coolant fluids
    kind: material
    layer: L7

