[project]
name = "sg-exchange-mcp"
version = "0.1.0"
description = "SupplyGraph exchange gateway: index constituents, fund holdings and company identity as an authenticated MCP server."
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
sg-exchange-mcp = "sg_exchange_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sg_exchange_mcp = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
