version: '3.9'

services:
  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "58100:8000"
    environment:
      SG_DB_URL: "sqlite:////app/data/supplygraph.db"
      DISG_MODEL: "claude-sonnet-4-5"
      # Optional: set ANTHROPIC_API_KEY if using AI categorization
      # ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
    command: disg serve --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/themes"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - redis

  # Frontend (Node dev server during development, or serve production build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: "http://localhost:58100/api"
      VITE_API_PROXY: "http://backend:8000"
    command: npm run dev
    depends_on:
      - backend

  # Redis (optional, for FX caching and future use)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
